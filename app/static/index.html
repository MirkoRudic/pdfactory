<header class="top">
  <div class="lead">
    <button id="bOpen"><svg class="icon"><use href="#i-open"/></svg>Open</button>
    <span class="hsep"></span>
    <button id="bUndo" class="sq" aria-label="Undo"><svg class="icon"><use href="#i-undo"/></svg></button>
    <button id="bRedo" class="sq" aria-label="Redo"><svg class="icon"><use href="#i-redo"/></svg></button>
  </div>
  <nav class="modes" aria-label="Mode">
    <button class="mode" data-mode="read"><svg class="icon"><use href="#i-book"/></svg>Read</button>
    <button class="mode" data-mode="edit"><svg class="icon"><use href="#i-pencil"/></svg>Edit</button>
    <button class="mode" data-mode="pages"><svg class="icon"><use href="#i-grid"/></svg>Pages</button>
  </nav>
  <div class="actions">
    <div class="split">
      <button id="bSave" class="primary"><svg class="icon"><use href="#i-save"/></svg>Save</button>
      <button id="bSaveMenu" class="primary sq" aria-label="More save options"><svg class="icon"><use href="#i-down"/></svg></button>
    </div>
    <button id="bPrint" class="sq" aria-label="Print"><svg class="icon"><use href="#i-print"/></svg></button>
    <button id="bSettings" class="sq" aria-label="Settings"><svg class="icon"><use href="#i-settings"/></svg></button>
    <button id="bQuit" class="sq" aria-label="Quit"><svg class="icon"><use href="#i-power"/></svg></button>
  </div>
</header>
<div id="tabs" class="tabs" hidden></div>
<div id="bars"></div>

<main id="main">
  <!-- start -->
  <section id="start" class="start" hidden>
    <div class="start-box">
      <div class="drop" id="drop">
        <img class="logo-big" src="/logo.png" alt="">
        <button class="primary" id="bOpen2"><svg class="icon"><use href="#i-open"/></svg>Open PDF</button>
        <span class="muted">or drop a file here</span>
      </div>
      <div class="recent" id="recent"></div>
    </div>
  </section>

  <!-- read + edit -->
  <section id="viewer" class="viewer" hidden>
    <aside class="thumbs" id="thumbs" aria-label="Pages"></aside>
    <div class="center">
      <div class="vbar" id="vbar">
        <div class="vbar-l" id="vbarL"></div>
        <div class="search">
          <svg class="icon"><use href="#i-search"/></svg>
          <input id="q" placeholder="Search" autocomplete="off">
          <span id="qn" class="muted"></span>
          <button class="sq ghost" id="qPrev" aria-label="Previous"><svg class="icon"><use href="#i-up"/></svg></button>
          <button class="sq ghost" id="qNext" aria-label="Next"><svg class="icon"><use href="#i-down"/></svg></button>
        </div>
        <div class="vbar-r" id="vbarR"></div>
      </div>
      <div class="pages" id="pages"></div>
    </div>
    <aside class="panel" id="panel" hidden></aside>
  </section>

  <!-- pages mode -->
  <section id="organizer" class="organizer" hidden>
    <div class="obar">
      <button id="oAdd"><svg class="icon"><use href="#i-file-plus"/></svg>Add PDF</button>
      <button id="oAll"><svg class="icon"><use href="#i-select"/></svg>Select all</button>
      <button id="oRotL" class="sq" aria-label="Rotate left"><svg class="icon"><use href="#i-rot-l"/></svg></button>
      <button id="oRotR" class="sq" aria-label="Rotate right"><svg class="icon"><use href="#i-rot-r"/></svg></button>
      <button id="oExtract"><svg class="icon"><use href="#i-export"/></svg>Extract selected</button>
      <button id="oSplit"><svg class="icon"><use href="#i-scissors"/></svg>Split</button>
      <button id="oDel"><svg class="icon"><use href="#i-trash"/></svg>Delete</button>
    </div>
    <div class="ogrid" id="ogrid"></div>
    <div class="olegend" id="olegend"></div>
  </section>
</main>

<footer class="bottom">
  <span id="fLeft" class="fside"></span>
  <span id="fMid" class="muted"></span>
  <span class="fside fright">
    <button class="sq small" id="z100" aria-label="Back to 100%"><svg class="icon"><use href="#i-zoom-reset"/></svg></button>
    <button class="sq small" id="zOut" aria-label="Zoom out"><svg class="icon"><use href="#i-minus"/></svg></button>
    <button class="ghost zval" id="zVal">100%</button>
    <button class="sq small" id="zIn" aria-label="Zoom in"><svg class="icon"><use href="#i-plus"/></svg></button>
  </span>
</footer>

<input type="file" id="fileImg" accept="image/*" hidden>
<script src="dialog.js"></script>
<script src="app.js"></script>
</body>
</html>
